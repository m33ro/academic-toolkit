<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch DOI to BibTeX Fetcher | ScholarKit</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <span class="text-xl font-bold text-indigo-400 tracking-tight">ScholarKit</span>
        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-medium border border-slate-700">Free Research Utilities</span>
      </a>
      <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition flex items-center space-x-1">
        <span>← All Tools</span>
      </a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-10 flex-grow w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-white mb-2">Batch DOI to BibTeX Fetcher</h1>
      <p class="text-slate-400">Paste DOIs to pull formatted BibTeX references directly from CrossRef.</p>
    </div>
    <div class="bg-slate-800/50 rounded-xl border border-slate-700 p-6 mb-8">
      <label class="block text-sm font-medium text-slate-300 mb-2">Paste DOIs (one per line or comma separated):</label>
      <textarea id="doi-input" rows="6" class="w-full p-3 bg-slate-900/80 border border-slate-600 rounded-lg font-mono text-xs text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="10.1038/s41586-020-2649-2"></textarea>
      <button id="fetch-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition cursor-pointer">
        Fetch & Download BibTeX
      </button>
      <div id="result-box" class="mt-4 p-4 bg-emerald-950/30 border border-emerald-800 rounded-lg text-emerald-200 text-sm hidden">
        <span class="font-semibold text-emerald-400">Fetch Complete!</span>
        <p id="result-stats" class="mt-1 text-slate-300"></p>
      </div>
    </div>
    <div class="mt-10 mb-6 flex justify-center">
      <a href="https://www.buymeacoffee.com/meero" target="_blank" rel="noopener noreferrer" class="inline-block transition transform hover:scale-105">
        <img src="https://cdn.buymeacoffee.com/buttons/v2/arial-blue.png" alt="Buy Me a Coffee" style="height: 48px !important; width: 174px !important;" class="rounded-lg shadow-sm">
      </a>
    </div>
  </main>
  <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span>© 2026 ScholarKit. All processing occurs locally in your client browser.</span>
      <div class="space-x-4">
        <a href="index.html" class="hover:text-slate-300 transition">Home</a>
        <a href="privacy.html" class="hover:text-slate-300 transition">Privacy Policy</a>
      </div>
    </div>
  </footer>
  <script>
    const doiInput = document.getElementById("doi-input"), fetchBtn = document.getElementById("fetch-btn"), resultBox = document.getElementById("result-box"), resultStats = document.getElementById("result-stats");
    fetchBtn.addEventListener("click", async () => {
      const rawText = doiInput.value.trim(); if (!rawText) return;
      const rawTokens = rawText.split(/[\n,]+/);
      const dois = rawTokens.map(t => { const m = t.match(/10\.\d{4,9}\/[-._;()/:A-Z0-9]+/i); return m ? m[0] : null; }).filter(Boolean);
      if (dois.length === 0) { alert("No valid DOIs detected."); return; }
      fetchBtn.disabled = true; fetchBtn.textContent = "Fetching citations...";
      let bibEntries = [], successCount = 0;
      for (const doi of dois) {
        try {
          const res = await fetch("https://api.crossref.org/works/" + encodeURIComponent(doi) + "/transform/application/x-bibtex");
          if (res.ok) { const entry = await res.text(); bibEntries.push(entry.trim()); successCount++; }
        } catch (e) { console.error(e); }
      }
      if (bibEntries.length > 0) {
        const blob = new Blob([bibEntries.join("\n\n") + "\n"], { type: "application/x-bibtex;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "scholarkit_references_" + Date.now() + ".bib";
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }
      resultStats.textContent = "Fetched " + successCount + " of " + dois.length + " citations.";
      resultBox.classList.remove("hidden"); fetchBtn.disabled = false; fetchBtn.textContent = "Fetch & Download BibTeX";
    });
  </script>
</body>
</html>
